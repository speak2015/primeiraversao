<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraga</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 520px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAFAF8;
      color: #3D3D3D;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      background: #1B4332;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .logo span { color: #F4C430; }
    .badge {
      font-size: 9px;
      background: #F4C430;
      color: #1B4332;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .usage-pill {
      font-size: 10px;
      color: #A8D5B5;
    }

    /* ── Auth screens ── */
    #auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 16px;
    }
    .auth-title {
      font-size: 22px;
      font-weight: 700;
      color: #1B4332;
      text-align: center;
    }
    .auth-sub {
      font-size: 13px;
      color: #8A8A8A;
      text-align: center;
      line-height: 1.5;
    }
    .auth-tabs {
      display: flex;
      gap: 0;
      border: 1px solid #E8E8E3;
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
    }
    .auth-tab {
      flex: 1;
      padding: 8px;
      border: none;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: #8A8A8A;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: #1B4332;
      color: #fff;
    }
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .auth-form input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #E8E8E3;
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
      outline: none;
      transition: border 0.2s;
    }
    .auth-form input:focus { border-color: #1B4332; }
    .btn-primary {
      width: 100%;
      padding: 11px;
      background: #1B4332;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      font-size: 12px;
      color: #c0392b;
      text-align: center;
      min-height: 16px;
    }

    /* ── Chat screen ── */
    #chat-screen { flex: 1; display: flex; flex-direction: column; }

    /* Tom */
    .tone-bar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid #E8E8E3;
      background: #fff;
    }
    .tone-btn {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid #E8E8E3;
      background: transparent;
      color: #8A8A8A;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
    }
    .tone-btn.active {
      background: #1B4332;
      color: #fff;
      border-color: #1B4332;
    }
    .tone-label { font-size: 10px; color: #8A8A8A; align-self: center; margin-right: 2px; }

    /* Contexto da página */
    .page-context {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #D8F3DC;
      font-size: 11px;
      color: #1B4332;
      border-bottom: 1px solid #A8D5B5;
    }
    .page-context .dot { width: 6px; height: 6px; background: #1B4332; border-radius: 50%; flex-shrink: 0; }
    .page-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

    /* Mensagens */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 260px;
      max-height: 320px;
    }
    .msg {
      max-width: 88%;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1B4332;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #E8E8E3;
      color: #3D3D3D;
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: flex-start;
      background: #fdecea;
      border: 1px solid #f5c6cb;
      color: #c0392b;
    }
    .msg.system {
      align-self: center;
      background: #FFFBEA;
      border: 1px solid #F4C430;
      color: #8A6A00;
      font-size: 11px;
      text-align: center;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .typing {
      align-self: flex-start;
      display: flex;
      gap: 4px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #E8E8E3;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
    }
    .typing span {
      width: 6px; height: 6px;
      background: #1B4332;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* Input */
    .input-area {
      padding: 10px 12px;
      border-top: 1px solid #E8E8E3;
      background: #fff;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      border: 1px solid #E8E8E3;
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      min-height: 38px;
      max-height: 100px;
      outline: none;
      transition: border 0.2s;
      background: #FAFAF8;
    }
    textarea:focus { border-color: #1B4332; }
    .send-btn {
      width: 38px; height: 38px;
      background: #1B4332;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* Limit warning */
    .limit-bar {
      padding: 10px 12px;
      background: #FFFBEA;
      border-top: 1px solid #F4C430;
      font-size: 11px;
      color: #8A6A00;
      text-align: center;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Header sempre visível -->
<div class="header">
  <div class="header-left">
    <div class="logo">Fra<span>ga</span></div>
    <div class="badge">BETA</div>
  </div>
  <div class="usage-pill" id="usage-display"></div>
</div>

<!-- Tela de autenticação -->
<div id="auth-screen">
  <div class="auth-title">Bem-vindo à Fraga 🇧🇷</div>
  <div class="auth-sub">A IA brasileira que te conhece<br>de verdade.</div>

  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Entrar</button>
    <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Criar conta</button>
  </div>

  <div class="auth-form">
    <input type="text" id="field-name" placeholder="Seu nome" class="hidden" />
    <input type="email" id="field-email" placeholder="Seu e-mail" />
    <input type="password" id="field-password" placeholder="Senha (mín. 8 caracteres)" />
    <div class="error-msg" id="auth-error"></div>
    <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Entrar</button>
  </div>
</div>

<!-- Tela de chat -->
<div id="chat-screen" class="hidden">

  <!-- Seletor de tom -->
  <div class="tone-bar">
    <span class="tone-label">Tom:</span>
    <button class="tone-btn active" data-tone="auto" onclick="setTone(this)">Automático</button>
    <button class="tone-btn" data-tone="informal" onclick="setTone(this)">Informal</button>
    <button class="tone-btn" data-tone="formal" onclick="setTone(this)">Formal</button>
  </div>

  <!-- Contexto da página atual -->
  <div class="page-context" id="page-context-bar">
    <div class="dot"></div>
    <span class="page-url" id="page-url-display">Carregando página...</span>
  </div>

  <!-- Mensagens -->
  <div class="messages" id="messages"></div>

  <!-- Aviso de limite -->
  <div class="limit-bar hidden" id="limit-bar">
    Você atingiu o limite do plano gratuito (50 perguntas). <strong>Faça upgrade para continuar.</strong>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea
      id="msg-input"
      placeholder="Pergunte qualquer coisa..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
